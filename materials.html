<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open City Web - materials</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; }
      #game { width: 100%; height: 100%; display: block; outline: none; }
      #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .label {
        position: absolute; transform: translate(-50%, 0); font: 11px/1.3 monospace; color: #bff;
        text-align: center; white-space: pre; text-shadow: 0 0 3px #000, 0 0 3px #000;
      }
      #msg {
        position: fixed; top: 8px; left: 8px; padding: 8px 10px; font: 12px/1.5 monospace; color: #7ff;
        background: rgba(0, 0, 0, 0.6); border: 1px solid #0ff4; white-space: pre; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="labels"></div>
    <div id="msg"></div>
    <script type="module" src="/src/preview/materials.ts"></script>
  </body>
</html>
